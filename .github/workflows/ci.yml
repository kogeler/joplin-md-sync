name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit for the version comparison
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality, offline tests, docs, and dependency locks
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run the Make CI contract
        env:
          RUFF_OUTPUT_FORMAT: github
        run: make ci PY=python

      # make ci already maps OAuth requirements after passing tests; when the
      # tests fail, map them anyway as evidence for the failure.
      - name: Map OAuth requirements for failed tests
        if: ${{ failure() && hashFiles('.artifacts/test-results.xml') != '' }}
        run: make oauth-acceptance-report PY=python

      # The report is written before its gate fails; keep what exists for diagnosis.
      - name: Upload OAuth acceptance evidence
        if: ${{ !cancelled() && hashFiles('.artifacts/test-results.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oauth-acceptance-evidence
          path: |
            .artifacts/oauth-e2e-evidence.json
            .artifacts/test-results.xml
            .artifacts/coverage.xml
            .artifacts/coverage-report.md
          if-no-files-found: warn

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('.artifacts/coverage-report.md') != '' }}
        run: cat .artifacts/coverage-report.md >> "$GITHUB_STEP_SUMMARY"

  live-joplin:
    name: Live protocols
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run live protocol acceptance
        run: make test-live PY=python

      - name: Run real Terminal and S3 acceptance
        run: make test-service-live

  compatibility:
    name: Compatibility (${{ matrix.platform }}-${{ matrix.arch }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux
            arch: amd64
            python: "3.13"
            python_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            python: "3.13"
            python_arch: arm64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            python: "3.14"
            python_arch: arm64
          - runner: windows-latest
            platform: windows
            arch: amd64
            python: "3.13"
            python_arch: x64
          - runner: windows-latest
            platform: windows
            arch: amd64
            python: "3.14"
            python_arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}

      - name: Run package tests and metadata checks
        shell: bash
        run: make test verify-release PY=python

      - name: Run headless service installer tests
        if: matrix.platform == 'linux'
        run: make test-service-installer PY=python

  distribution:
    name: Distribution (${{ matrix.platform }}-${{ matrix.arch }})
    needs:
      - quality
      - version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux
            arch: amd64
            python_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            python_arch: arm64
          - runner: windows-latest
            platform: windows
            arch: amd64
            python_arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python_arch }}

      - name: Build and smoke-test native executable
        shell: bash
        env:
          # Empty unless this pull request publishes a candidate.
          JOPLIN_MD_SYNC_BUILD_VERSION: ${{ needs.version.outputs.candidate }}
        run: make standalone checksums smoke-standalone verify-release PY=python

      - name: Verify native OAuth in the real systemd user sandbox
        if: matrix.platform == 'linux'
        run: make oauth-systemd-host test-oauth-systemd PY=python

      - name: Upload smoke-tested native executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/joplin-md-sync-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

      - name: Set up Python for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Audit locked dependencies for fork fallback
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: make audit PY=python

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: .github/workflows/codeql.yml:analyze/language:${{ matrix.language }}
          output: .artifacts/codeql

      - name: Upload CodeQL dataflow evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-evidence
          path: .artifacts/codeql/*.sarif
          if-no-files-found: error
          retention-days: 7

  version:
    name: Version increment
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Check out base version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              github.event.pull_request.base.sha ||
              github.event.before ||
              inputs.base_ref
            }}
          path: base
          persist-credentials: false

      - name: Check out proposed version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Resolve publication state of the proposed version
        id: release-baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION_PATH: source/.version
        with:
          script: |
            const fs = await import("node:fs/promises");
            const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            const version = (await fs.readFile(process.env.VERSION_PATH, "utf8")).trim();
            if (!stable.test(version)) {
              throw new Error(".version is not a stable semantic version");
            }
            let publishedCurrent = false;
            try {
              const current = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: `v${version}`,
              });
              publishedCurrent = !current.data.draft && !current.data.prerelease;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // Empty while the current version is published.
            let latestVersion = "";
            if (!publishedCurrent) {
              latestVersion = "0.0.0";
              try {
                const latest = await github.rest.repos.getLatestRelease({ ...context.repo });
                latestVersion = latest.data.tag_name.replace(/^v/, "");
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (!stable.test(latestVersion)) {
                throw new Error("latest published release is not a stable vX.Y.Z tag");
              }
            }
            core.setOutput("latest_release", latestVersion);

      - name: Require an increase for a changed or unpublished version
        working-directory: source
        env:
          LATEST_RELEASE: ${{ steps.release-baseline.outputs.latest_release }}
        run: make version-check PY=python BASE_VERSION_FILE=../base/.version LATEST_RELEASE="$LATEST_RELEASE"

      # A same-repository pull request that changes .version publishes every
      # push as a prerelease candidate X.Y.Z-prN.gSHORTSHA.
      - name: Name the pull request candidate
        id: candidate
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: source
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version="$(make -s candidate-version PY=python BASE_VERSION_FILE=../base/.version PR_NUMBER="$PR_NUMBER" HEAD_SHA="$HEAD_SHA")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Writes only release metadata and already smoke-tested files; never checks
  # out or runs pull request code with the write token.
  candidate:
    name: Publish pull request candidate
    needs:
      - version
      - distribution
    if: needs.version.outputs.candidate != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download smoke-tested Linux executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-linux-*
          path: candidate
          merge-multiple: true

      - name: Replace this pull request's candidate prerelease
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.candidate }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          assets=(joplin-md-sync-linux-amd64 joplin-md-sync-linux-arm64)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-pr${PR_NUMBER}\.g[0-9a-f]{7}$" || true; } \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          gh release create "v$VERSION" "${assets[@]}" SHA256SUMS.txt \
            --prerelease --latest=false --target "$HEAD_SHA" \
            --title "${VERSION%%-*} candidate · PR #$PR_NUMBER · ${HEAD_SHA:0:7}" \
            --notes "Candidate build of $PR_URL at commit \`$HEAD_SHA\`, replaced by the next push. Install it as described in https://joplin-mcp.romancello.net/user/JOPLIN_HEADLESS_SERVICE/#test-an-unpublished-runtime-candidate"

  # The default-branch ruleset requires only this check, so renamed jobs,
  # matrix changes or conditional jobs cannot leave a pull request waiting for
  # a check that never reports. always() keeps it reporting when a dependency
  # fails or is cancelled: a skipped required check would count as passing.
  # Jobs after quality are skipped only when quality failed or was cancelled;
  # dependency review is skipped by design outside pull requests. Candidate
  # publication is a convenience, not a merge gate, and is not included.
  result:
    name: CI result
    if: always()
    needs:
      - quality
      - live-joplin
      - compatibility
      - distribution
      - dependency-review
      - codeql
      - version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every CI job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1
