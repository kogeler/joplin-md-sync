name: Dependency submission

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-submission-main
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit dependency graph
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted main ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build exact lock manifests without network access
        run: make dependency-snapshot PY=python

      - name: Submit all four lock manifests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_REPOSITORY: kogeler/joplin-md-sync
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== process.env.EXPECTED_REPOSITORY) {
              throw new Error(`Refusing to submit dependencies for ${repository}`);
            }
            const snapshot = JSON.parse(
              await fs.readFile(".artifacts/dependency-snapshot.json", "utf8"),
            );
            if (
              !snapshot ||
              typeof snapshot !== "object" ||
              Array.isArray(snapshot) ||
              Object.keys(snapshot).length !== 1 ||
              !snapshot.manifests ||
              typeof snapshot.manifests !== "object" ||
              Array.isArray(snapshot.manifests)
            ) {
              throw new Error("Dependency snapshot has an invalid top-level shape");
            }
            const expected = [
              "requirements-dev.txt",
              "requirements-docs.txt",
              "requirements-package.txt",
              "requirements-test.txt",
            ];
            const actual = Object.keys(snapshot.manifests).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`Dependency snapshot has unexpected manifests: ${actual.join(", ")}`);
            }
            for (const name of expected) {
              const manifest = snapshot.manifests[name];
              if (
                manifest?.name !== name ||
                manifest?.file?.source_location !== name ||
                !manifest?.resolved ||
                typeof manifest.resolved !== "object" ||
                Array.isArray(manifest.resolved)
              ) {
                throw new Error(`Dependency snapshot has an invalid ${name} manifest`);
              }
              if (Object.keys(manifest.resolved).length === 0) {
                throw new Error(`Dependency snapshot has an empty ${name} manifest`);
              }
            }
            const response = await github.request(
              "POST /repos/{owner}/{repo}/dependency-graph/snapshots",
              {
                ...context.repo,
                version: 0,
                sha: context.sha,
                ref: context.ref,
                job: {
                  correlator: "joplin-md-sync-pip-locks",
                  id: String(context.runId),
                  html_url: `${context.serverUrl}/${repository}/actions/runs/${context.runId}`,
                },
                detector: {
                  name: "joplin-md-sync-pip-locks",
                  version: "1",
                  url: `${context.serverUrl}/${repository}/blob/${context.sha}/.github/scripts/dependency_snapshot.py`,
                },
                scanned: new Date().toISOString(),
                manifests: snapshot.manifests,
                headers: {
                  accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2026-03-10",
                },
              },
            );
            if (response.status !== 201 || response.data.result !== "SUCCESS") {
              throw new Error(
                `Dependency submission failed: HTTP ${response.status}, ` +
                `result ${response.data.result}: ${response.data.message}`,
              );
            }
            core.notice(`${response.data.message} (result: ${response.data.result})`);
