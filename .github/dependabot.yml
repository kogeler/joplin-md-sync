version: 2
updates:
  # uv owns both the manifest and the universal lock, including transitive updates.
  - package-ecosystem: uv
    directory: /
    # Runtime requirements carry upper bounds because PyPI installs resolve
    # them without the lock. Raise a bound in the same PR only when a release
    # falls outside it; in-range releases update the lock alone.
    versioning-strategy: increase-if-necessary
    # One owner and one version-update PR for the complete Python graph.
    # Grouping alone does not opt transitive lock entries into updates.
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The hash-pinned uv that Make installs into every host environment.
  - package-ecosystem: pip
    directory: /tools/uv
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
