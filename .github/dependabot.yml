version: 2
updates:
  # uv owns both the manifest and the universal lock, including transitive updates.
  - package-ecosystem: uv
    directory: /
    # One owner and one version-update PR for the complete Python graph.
    # Grouping alone does not opt transitive lock entries into updates.
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
