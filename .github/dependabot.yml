version: 2
updates:
  # The requirements-*.in files own direct versions and pip-compile owns their
  # same-stem hash locks. pyproject.toml holds only package metadata and the
  # manually maintained build-backend pin, so it is excluded from pip manifests.
  - package-ecosystem: pip
    directory: /
    # One owner and one version-update PR for the complete Python graph.
    # Grouping alone does not opt transitive lock entries into updates.
    allow:
      - dependency-type: all
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    exclude-paths:
      - pyproject.toml
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 1
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
