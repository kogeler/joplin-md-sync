# Include inside your existing HTTPS server; preserve current MCP/Actions rules.
# Serve the --github-oauth-public-url host; proxy to the existing adapter port.
location = /healthz { return 404; }
location = /readyz { return 404; }

location ~ ^/(claude/mcp|authorize|register|token|consent|auth/callback|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(/claude/mcp)?)$ {
    # Callback query parameters contain authorization codes and state.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_buffering off;
    client_max_body_size 16m;
}
