{% extends "main.html" %}

{% block extrahead %}
  {{ super() }}
  <script type="application/ld+json">
    {{ {
      "@context": "https://schema.org",
      "@type": "SoftwareSourceCode",
      "name": "joplin-md-sync",
      "alternateName": config.site_name,
      "description": page.meta.description,
      "url": config.site_url,
      "codeRepository": config.repo_url,
      "programmingLanguage": "Python",
      "runtimePlatform": ["Linux", "Windows"],
      "license": "https://opensource.org/licenses/MIT",
      "author": {"@type": "Person", "name": config.site_author, "url": "https://github.com/kogeler"},
      "keywords": ["Joplin", "MCP server", "Model Context Protocol", "Claude", "ChatGPT", "AI agents", "self-hosted", "Markdown sync"]
    } | tojson }}
  </script>
{% endblock %}

{% block tabs %}
  {{ super() }}
  <div class="product-home">
    {{ page.content }}
  </div>
{% endblock %}

{% block content %}{% endblock %}
