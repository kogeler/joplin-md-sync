[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joplin-md-sync"
# The version lives in the root .version file (see docs/contracts/CI_RELEASES.md).
dynamic = ["version"]
description = "Self-hosted Joplin access for ChatGPT Actions, local stdio and HTTP MCP clients, and reviewable Markdown workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "joplin-md-sync contributors" }]
keywords = ["joplin", "chatgpt", "mcp", "self-hosted", "markdown", "notes", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# Runtime dependency policy is owned by docs/contracts/DEPENDENCIES.md.
dependencies = []

[project.optional-dependencies]
# Direct tools track their latest stable compatible releases and use exact pins.
# pip-compile resolves their transitive dependencies into separate hash locks so
# a platform-specific tool limitation does not force a repository-wide downgrade.
dev = [
    "bandit[toml]==1.9.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "ruff==0.16.5",
]
test = [
    # pip-compile evaluates platform markers on its Linux host. Keep the latest
    # Windows console dependency explicit so this lock is installable there.
    "colorama==0.4.6",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]
package = [
    "build==1.6.0",
    "colorama==0.4.6",
    "pefile==2024.8.26",
    "pyinstaller==6.22.2",
    "pywin32-ctypes==0.2.3",
]
docs = ["mkdocs-material==9.7.7"]

[project.urls]
Homepage = "https://joplin-mcp.romancello.net/"
Documentation = "https://joplin-mcp.romancello.net/"
Repository = "https://github.com/kogeler/joplin-md-sync"
Issues = "https://github.com/kogeler/joplin-md-sync/issues"
Changelog = "https://github.com/kogeler/joplin-md-sync/blob/main/CHANGELOG.md"

[project.scripts]
joplin-md-sync = "joplin_md_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ".version" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "tests_live", "scripts/joplin_terminal_service/tests"]
skips = ["B101", "B105", "B110"]

[tool.mypy]
python_version = "3.13"
strict = true
# json.loads returns Any by design; forcing casts everywhere adds noise, not safety.
warn_return_any = false
files = ["src"]
