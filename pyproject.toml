[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joplin-md-sync"
# The version lives in the root .version file (see docs/contracts/CI_RELEASES.md).
dynamic = ["version"]
description = "Self-hosted Joplin access for ChatGPT Actions, local stdio and HTTP MCP clients, and reviewable Markdown workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "joplin-md-sync contributors" }]
keywords = ["joplin", "chatgpt", "mcp", "self-hosted", "markdown", "notes", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# Runtime dependency policy is owned by docs/contracts/DEPENDENCIES.md. Internal
# tool versions live in requirements-*.in and their generated hash locks.
dependencies = []

[project.urls]
Homepage = "https://joplin-mcp.romancello.net/"
Documentation = "https://joplin-mcp.romancello.net/"
Repository = "https://github.com/kogeler/joplin-md-sync"
Issues = "https://github.com/kogeler/joplin-md-sync/issues"
Changelog = "https://github.com/kogeler/joplin-md-sync/blob/main/CHANGELOG.md"

[project.scripts]
joplin-md-sync = "joplin_md_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ".version" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "tests_live", "scripts/joplin_terminal_service/tests"]
skips = ["B101", "B105", "B110"]

[tool.mypy]
python_version = "3.13"
strict = true
# json.loads returns Any by design; forcing casts everywhere adds noise, not safety.
warn_return_any = false
files = ["src"]
