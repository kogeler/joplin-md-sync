[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "joplin-md-sync"
# The version lives in the root .version file (see docs/contracts/CI_RELEASES.md).
dynamic = ["version"]
description = "Self-hosted Joplin access for ChatGPT Actions, local stdio and HTTP MCP clients, and reviewable Markdown workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "joplin-md-sync contributors" }]
keywords = ["joplin", "chatgpt", "mcp", "self-hosted", "markdown", "notes", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# Development tools are local dependency groups, never runtime requirements.
dependencies = []

[project.urls]
Homepage = "https://joplin-mcp.romancello.net/"
Documentation = "https://joplin-mcp.romancello.net/"
Repository = "https://github.com/kogeler/joplin-md-sync"
Issues = "https://github.com/kogeler/joplin-md-sync/issues"
Changelog = "https://github.com/kogeler/joplin-md-sync/blob/main/CHANGELOG.md"

[project.scripts]
joplin-md-sync = "joplin_md_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ".version" }

[dependency-groups]
quality = [
    "bandit[toml]>=1.9.4",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "ruff>=0.17.1",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
build = [
    "build>=1.6.1",
    "pyinstaller>=6.22.3",
    "setuptools",
]
docs = ["mkdocs-material>=9.7.7"]

[tool.uv]
required-version = ">=0.11"
default-groups = []
# The editable package version comes from a separate file.
cache-keys = [{ file = "pyproject.toml" }, { file = ".version" }]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "tests_live", "scripts/joplin_terminal_service/tests"]
skips = ["B101", "B105", "B110"]

[tool.mypy]
python_version = "3.13"
strict = true
# json.loads returns Any by design; forcing casts everywhere adds noise, not safety.
warn_return_any = false
files = ["src"]
